name: build
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "0 4 * * 1"}]   # weekly rebuild picks up base-image fixes
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements.txt pytest && PYTHONPATH=src pytest -q tests
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/trivy-monitor:latest
      - name: Scan our own image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/trivy-monitor:latest
          severity: CRITICAL,HIGH
          exit-code: "0"
